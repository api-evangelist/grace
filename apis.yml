aid: grace
name: Grace
description: >-
  Grace (Grâce) is a Paris-based insurtech that lets luxury maisons offer their
  clients complimentary, embedded protection against theft, loss, and damage for
  high-value goods such as watches, jewelry, and accessories. Founded in 2022 and
  backed by Speedinvest and FinTech Collective, Grace pairs a top-tier underwriter
  with a technology platform that handles instant coverage, fraud detection, claims
  processing, and logistics through the Grace app, and integrates into a brand's
  existing purchase journeys via a customizable API. The company raised a €5.9M seed
  round in 2025 and operates across Europe and beyond. Grace publishes no public
  developer portal or API specification; its API is a private, partner-facing
  integration offered to luxury brands.
